name: Release images

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: Immutable image tag
        required: true

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [api, web]
    steps:
      - uses: actions/checkout@v4
      - name: Validate public build configuration
        env:
          DEPLOYMENT_PROFILE: ${{ vars.DEPLOYMENT_PROFILE }}
          PUBLIC_WEB_URL: ${{ vars.PUBLIC_WEB_URL }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          APPLE_CLIENT_ID: ${{ vars.APPLE_CLIENT_ID }}
          APPLE_REDIRECT_URI: ${{ vars.APPLE_REDIRECT_URI }}
        run: |
          case "$DEPLOYMENT_PROFILE" in pilot|go_live) ;; *) echo "DEPLOYMENT_PROFILE must be pilot or go_live" >&2; exit 1;; esac
          for name in PUBLIC_WEB_URL GOOGLE_CLIENT_ID APPLE_CLIENT_ID APPLE_REDIRECT_URI; do
            test -n "${!name}" || { echo "Missing repository variable: $name" >&2; exit 1; }
          done
          node scripts/verify-release-web-config.mjs
      - uses: docker/setup-buildx-action@v3
      - name: Normalize image namespace
        id: image
        run: echo "namespace=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: ghcr.io/${{ steps.image.outputs.namespace }}/marketplace-${{ matrix.target }}:${{ inputs.release || github.ref_name }}
          build-args: |
            DEPLOYMENT_PROFILE=${{ vars.DEPLOYMENT_PROFILE }}
            NEXT_PUBLIC_API_URL=/api
            NEXT_PUBLIC_BUYER_APP_URL=/
            NEXT_PUBLIC_SUPPLIER_APP_URL=/supplier
            INTERNAL_API_URL=http://api:4000/api
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ vars.GOOGLE_CLIENT_ID }}
            NEXT_PUBLIC_APPLE_CLIENT_ID=${{ vars.APPLE_CLIENT_ID }}
            NEXT_PUBLIC_APPLE_REDIRECT_URI=${{ vars.APPLE_REDIRECT_URI }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
