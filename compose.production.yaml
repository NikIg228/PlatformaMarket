name: dental-marketplace-production

x-runtime: &runtime
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  networks: [marketplace]
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:
  api:
    <<: *runtime
    image: ${REGISTRY:?Set REGISTRY}/marketplace-api:${APP_RELEASE:?Set APP_RELEASE}
    command: ["/bin/sh", "-c", "npm exec --workspace=@marketplace/api -- prisma migrate deploy && exec npm run start --workspace=@marketplace/api"]
    env_file: ["${ENV_FILE:-.env.production}"]
    environment: { PROCESS_ROLE: api }
    expose: ["4000"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4000/api/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    stop_grace_period: 45s
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 2G }

  worker:
    <<: *runtime
    image: ${REGISTRY:?Set REGISTRY}/marketplace-api:${APP_RELEASE:?Set APP_RELEASE}
    command: ["npm", "run", "start:worker", "--workspace=@marketplace/api"]
    env_file: ["${ENV_FILE:-.env.production}"]
    environment: { PROCESS_ROLE: worker }
    stop_grace_period: 45s
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 2G }

  web:
    <<: *runtime
    image: ${REGISTRY}/marketplace-web:${APP_RELEASE}
    environment: { INTERNAL_API_URL: "http://api:4000/api" }
    expose: ["3000"]
    depends_on: { api: { condition: service_healthy } }
    deploy: { resources: { limits: { cpus: "1.0", memory: 1G } } }

  caddy:
    <<: *runtime
    image: caddy:2.10-alpine
    environment:
      WEB_DOMAIN: ${WEB_DOMAIN:?Set WEB_DOMAIN}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api: { condition: service_healthy }
      web: { condition: service_started }

networks: { marketplace: {} }
volumes: { caddy-data: {}, caddy-config: {} }
